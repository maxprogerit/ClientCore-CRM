apiVersion: apps/v1
kind: Deployment
metadata:
  name: clientcore-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clientcore-backend
  template:
    metadata:
      labels:
        app: clientcore-backend
    spec:
      containers:
        - name: backend
          image: clientcore/backend:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: clientcore-backend
spec:
  selector:
    app: clientcore-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clientcore-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clientcore-frontend
  template:
    metadata:
      labels:
        app: clientcore-frontend
    spec:
      containers:
        - name: frontend
          image: clientcore/frontend:latest
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: clientcore-frontend
spec:
  selector:
    app: clientcore-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5173
